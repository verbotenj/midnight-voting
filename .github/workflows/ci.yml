name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run repo:check
      - run: npm run check:cloudflare
      - run: npm run contract:setup
      - run: npm run contract:compile
      - run: npm run contract:verify
      - run: npm run check
      - run: npm run contract:test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:public
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare
      # Never restore wallet secrets, start live actors, deploy, or spend DUST here.
